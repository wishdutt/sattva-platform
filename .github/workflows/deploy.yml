name: Deploy infrastructure

# Manual, environment-gated deploys using GitHub OIDC (no long-lived AWS keys in GitHub).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # configure required reviewers for prod in repo settings
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @lsp/api
      - run: npm run build -w @lsp/api
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - name: Write backend and tfvars from environment variables
        working-directory: infrastructure/terraform/envs/${{ inputs.environment }}
        run: |
          echo '${{ vars.TF_BACKEND_HCL }}' > backend.hcl
          echo '${{ vars.TF_VARS }}' > terraform.tfvars
      - working-directory: infrastructure/terraform/envs/${{ inputs.environment }}
        run: |
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
