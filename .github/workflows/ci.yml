name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @lsp/api
      - run: npm run build -w @lsp/web
        env:
          NEXT_PUBLIC_AUTH_MODE: cognito
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo install --check
      - run: npx expo export --platform android --platform ios --output-dir dist

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # archive_file needs the Lambda bundles to exist for `validate`.
      - run: npm ci && npm run build -w @lsp/api
      - run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - run: |
          for env in dev prod; do
            terraform -chdir=infrastructure/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infrastructure/terraform/envs/$env validate
          done
