# Fully self-hosted local stack (no AWS, no SaaS accounts):
#   docker compose up --build
# Web http://localhost:3000 · API http://localhost:4000 · Keycloak http://localhost:8080 (admin/admin)
# Mail UI http://localhost:8025 · MinIO console http://localhost:9001 (minioadmin/minioadmin)
# Demo users (local only): organizer@example.com / LocalDev#Organizer1, viewer@example.com / LocalDev#Viewer1
#
# All credentials in this file are LOCAL-DEVELOPMENT placeholders. See docs/self-hosting.md for production.

name: stagecast

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stagecast
      POSTGRES_PASSWORD: stagecast
      POSTGRES_DB: stagecast
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stagecast']
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ['9000:9000', '9001:9001']

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/stagecast-media;
      mc anonymous set none local/stagecast-media;
      mc ilm rule add --expire-days 365 --prefix recordings/ local/stagecast-media || true;
      "

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens must carry iss=http://localhost:8080/... for browsers AND the API container.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    volumes:
      - ./infrastructure/docker/keycloak:/opt/keycloak/data/import:ro
    ports: ['8080:8080']

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./infrastructure/docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50000-50100:50000-50100/udp'

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: '4000'
      STAGE: local-docker
      WEB_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      STORE: postgres
      DATABASE_URL: postgres://stagecast:stagecast@postgres:5432/stagecast
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8080/realms/stagecast
      OIDC_JWKS_URL: http://keycloak:8080/realms/stagecast/protocol/openid-connect/certs
      OIDC_AUDIENCES: stagecast-web,stagecast-mobile
      OIDC_GROUPS_CLAIM: groups
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: local-dev-secret-change-me-0123456789abcdef
      S3_BUCKET: stagecast-media
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      MAIL_PROVIDER: smtp
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Stagecast <events@stagecast.local>
    ports: ['4000:4000']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_AUTH_MODE: oidc
        NEXT_PUBLIC_OIDC_AUTHORITY: http://localhost:8080/realms/stagecast
        NEXT_PUBLIC_OIDC_CLIENT_ID: stagecast-web
        NEXT_PUBLIC_OIDC_PROVIDER_NAME: Stagecast account
        NEXT_PUBLIC_LIVEKIT_WS_ORIGIN: ws://localhost:7880
        NEXT_PUBLIC_MEDIA_ORIGIN: http://localhost:9000
    depends_on: [api]
    ports: ['3000:3000']

volumes:
  pgdata:
  miniodata:
